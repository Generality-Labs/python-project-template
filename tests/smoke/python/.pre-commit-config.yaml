# Pre-commit runs hooks from the Git root, so the Ruff hooks specify the
# fixture's project directory. With --all-files they check the whole repo.
repos:
  - repo: local
    hooks:
      - id: hook-python-version
        name: Check that the hook uses Python 3.12
        language: python
        language_version: python3.12
        entry: python -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: ruff check
        entry: uv run --locked --project tests/smoke/python ruff check --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --locked --project tests/smoke/python ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
